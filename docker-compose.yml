services:
  # 1. FastAPI Web Server Instance
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate_api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. ARQ Background Consumer Worker Instance
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate_worker
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "app.queue.run_worker"]
    env_file:
      - .env
    depends_on:
      - api
